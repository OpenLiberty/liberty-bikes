global:
  scrape_interval:     15s

  external_labels:
    monitor: 'game-service-monitor'

scrape_configs:
- job_name: 'game-service'
  scrape_interval: 5s
  metrics_path: '/metrics/'
  static_configs:
  - targets: ['game.1ibd03sq8zc5.eu-gb.codeengine.appdomain.cloud']
  scheme: https
  tls_config:
    insecure_skip_verify: true
- job_name: 'player-service'
  scrape_interval: 5s
  metrics_path: '/metrics/'
  static_configs:
  - targets: ['player.1ibd03sq8zc5.eu-gb.codeengine.appdomain.cloud']
  scheme: https
  tls_config:
    insecure_skip_verify: true
- job_name: 'demo-failing-service'
  scrape_interval: 5s
  metrics_path: '/metrics/'
  static_configs:
  - targets: ['127.0.0.1:8082']
  scheme: http
  tls_config:
    insecure_skip_verify: true
- job_name: 'frontend'
  scrape_interval: 5s
  metrics_path: '/metrics/'
  static_configs:
  - targets: ['frontend.1ibd03sq8zc5.eu-gb.codeengine.appdomain.cloud']
  scheme: https
  tls_config:
    insecure_skip_verify: true